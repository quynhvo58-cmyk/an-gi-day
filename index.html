<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodie App - Ăn Gì Đây?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wheel-container { position: relative; width: 280px; height: 280px; margin: 0 auto; }
    #wheel { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #8b5cf6; transition: transform 3.5s cubic-bezier(0.15, 0.99, 0.18, 0.99); }
    .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 26px solid #ef4444; z-index: 10; }
  </style>
</head>
<body class="bg-purple-50 text-slate-800 pb-24">

  <!-- Header -->
  <div class="p-5 bg-white rounded-b-3xl shadow-sm flex justify-between items-center sticky top-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-full bg-purple-100 flex items-center justify-center text-xl">🍜</div>
      <div>
        <p class="text-xs text-slate-400 font-medium">Hôm nay ăn gì?</p>
        <h1 class="text-lg font-bold text-slate-800">Foodie App ✨</h1>
      </div>
    </div>
    <!-- Nút bật định vị GPS -->
    <button onclick="getUserLocation()" id="btn-gps" class="px-3 py-1.5 bg-purple-100 hover:bg-purple-200 text-purple-700 text-xs font-bold rounded-xl flex items-center gap-1.5 transition">
      <i class="fa-solid fa-location-crosshairs text-sm"></i>
      <span id="gps-status">Định vị GPS</span>
    </button>
  </div>

  <!-- TAB 1: KHÁM PHÁ -->
  <div id="tab-home" class="p-5 space-y-5">
    <!-- Bộ Lọc -->
    <div class="bg-white p-4 rounded-3xl shadow-sm space-y-3 border border-purple-100">
      <h2 class="text-xs font-bold text-purple-600 uppercase tracking-wider"><i class="fa-solid fa-filter mr-1"></i> Bộ lọc tìm kiếm</h2>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] text-slate-400 font-semibold mb-1 block">Khu vực / Quận</label>
          <select id="filter-district" class="w-full p-2.5 bg-slate-100 rounded-xl text-xs font-semibold outline-none border border-transparent focus:border-purple-400">
            <option value="Quận 1">Quận 1 (50 quán)</option>
            <option value="Quận 3">Quận 3 (50 quán)</option>
            <option value="Quận 4">Quận 4 (50 quán)</option>
            <option value="Quận 5">Quận 5 (50 quán)</option>
            <option value="Quận 7">Quận 7 (50 quán)</option>
            <option value="Quận 10">Quận 10 (50 quán)</option>
            <option value="Quận 12">Quận 12 (50 quán)</option>
            <option value="Bình Thạnh">Bình Thạnh (50 quán)</option>
            <option value="Tân Bình">Tân Bình (50 quán)</option>
            <option value="Thủ Đức">Thủ Đức (50 quán)</option>
          </select>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 font-semibold mb-1 block">Loại món ăn</label>
          <select id="filter-category" class="w-full p-2.5 bg-slate-100 rounded-xl text-xs font-semibold outline-none border border-transparent focus:border-purple-400">
            <option value="all">Tất cả thể loại</option>
            <option value="kho">Món Khô (Cơm, Bánh mì...)</option>
            <option value="nuoc">Món Nước (Phở, Bún...)</option>
            <option value="han">Đồ Hàn Quốc</option>
            <option value="trung">Đồ Trung / Dimsum</option>
            <option value="tay">Đồ Tây / Pizza</option>
            <option value="an_vat">Ăn vặt / Cà phê</option>
          </select>
        </div>
      </div>

      <button onclick="searchRestaurants()" class="w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs shadow-md active:scale-95 transition">
        <i class="fa-solid fa-magnifying-glass mr-1"></i> Tìm Quán Ngay
      </button>
    </div>

    <!-- Danh Sách Quán -->
    <div class="space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Xếp theo ⭐ Cao -> Thấp</h3>
        <span class="text-xs font-bold text-purple-600 bg-purple-100 px-2 py-0.5 rounded-full" id="count-res">0 quán</span>
      </div>
      
      <!-- Danh sách hiển thị -->
      <div id="food-list" class="space-y-3"></div>

      <!-- Phân Trang (Pagination) -->
      <div id="pagination" class="flex justify-center items-center gap-1.5 pt-4"></div>
    </div>
  </div>

  <!-- TAB 2: LỊCH SỬ & NHẬT KÝ -->
  <div id="tab-history" class="p-5 space-y-5 hidden">
    <div class="flex bg-slate-200/60 p-1 rounded-2xl text-xs font-bold">
      <button onclick="switchHistorySubTab('logs')" id="subnav-logs" class="flex-1 py-2 rounded-xl bg-white text-purple-600 shadow-sm transition">
        📸 Nhật Ký Đã Ăn
      </button>
      <button onclick="switchHistorySubTab('saved')" id="subnav-saved" class="flex-1 py-2 rounded-xl text-slate-500 transition">
        ⭐ Quán Đã Lưu
      </button>
    </div>

    <div id="subtab-logs" class="space-y-4">
      <button onclick="toggleUploadModal()" class="w-full py-3 bg-white border-2 border-dashed border-purple-300 rounded-2xl text-purple-600 text-xs font-bold flex items-center justify-center gap-2 hover:bg-purple-50 transition">
        <i class="fa-solid fa-cloud-arrow-up text-lg"></i> Check-in Quán Vừa Ăn
      </button>
      <div id="user-logs-list" class="space-y-3"></div>
    </div>

    <div id="subtab-saved" class="space-y-3 hidden">
      <div id="saved-list" class="space-y-3"></div>
    </div>
  </div>

  <!-- TAB 3: VÒNG QUAY -->
  <div id="tab-wheel" class="p-5 space-y-5 hidden text-center">
    <div>
      <h2 class="text-xl font-bold text-slate-800">Vòng Quay Món Ăn 🎡</h2>
      <p class="text-xs text-slate-500 mt-1">Hôm nay phân vân quá thì để vòng quay chọn giúp nhé!</p>
    </div>

    <div class="py-2">
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="280" height="280"></canvas>
      </div>
    </div>

    <button onclick="spinWheel()" class="px-8 py-3 bg-purple-600 text-white font-bold text-sm rounded-full shadow-lg active:scale-95 transition">
      QUAY MÓN ĂN 🚀
    </button>
    
    <div id="wheel-result-box" class="hidden bg-white p-4 rounded-3xl border border-purple-100 shadow-sm space-y-3 text-left">
      <p class="text-xs font-semibold text-purple-600 uppercase">Món trúng thưởng:</p>
      <h3 id="wheel-result-title" class="text-lg font-bold text-slate-800"></h3>
      <hr>
      <p class="text-xs font-bold text-slate-500">Đề xuất quán ngon nổi tiếng:</p>
      <div id="wheel-recommend-list" class="space-y-2"></div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t py-2 px-6 flex justify-around items-center z-20 shadow-lg">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-purple-600">
      <i class="fa-solid fa-compass text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Khám phá</span>
    </button>
    <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-clock-rotate-left text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Lịch sử</span>
    </button>
    <button onclick="switchTab('wheel')" id="nav-wheel" class="flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-bullseye text-lg"></i>
      <span class="text-[10px] font-bold mt-1">Vòng quay</span>
    </button>
  </div>

  <!-- MODAL CHECK-IN -->
  <div id="upload-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-3 animate-slide-up">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base">Check-in Nhật Ký Ăn Uống</h3>
        <button onclick="toggleUploadModal()" class="text-slate-400 text-2xl">&times;</button>
      </div>
      
      <input id="log-name" type="text" placeholder="Tên quán từng đi..." class="w-full p-2.5 bg-slate-100 rounded-xl text-xs outline-none">
      <input id="log-price" type="text" placeholder="Giá dao động (VD: 40k - 80k)..." class="w-full p-2.5 bg-slate-100 rounded-xl text-xs outline-none">
      <textarea id="log-note" placeholder="Ghi chú (Món ngon nên thử, không gian...)" class="w-full p-2.5 bg-slate-100 rounded-xl text-xs outline-none h-20"></textarea>

      <div>
        <label class="text-[11px] font-bold text-slate-500 block mb-1">Tải ảnh đồ ăn / Menu từ điện thoại:</label>
        <input id="log-file" type="file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200">
      </div>

      <button id="btn-submit-log" onclick="saveLog()" class="w-full py-3 bg-purple-600 text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition">
        Lưu Nhật Ký
      </button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const districts = ['Quận 1', 'Quận 3', 'Quận 4', 'Quận 5', 'Quận 7', 'Quận 10', 'Quận 12', 'Bình Thạnh', 'Tân Bình', 'Thủ Đức'];
    
    // Tọa độ trung tâm đại diện cho từng quận
    const districtCoords = {
      'Quận 1': { lat: 10.7769, lng: 106.7009 },
      'Quận 3': { lat: 10.7828, lng: 106.6841 },
      'Quận 4': { lat: 10.7578, lng: 106.7013 },
      'Quận 5': { lat: 10.7541, lng: 106.6634 },
      'Quận 7': { lat: 10.7340, lng: 106.7217 },
      'Quận 10': { lat: 10.7721, lng: 106.6679 },
      'Quận 12': { lat: 10.8671, lng: 106.6413 },
      'Bình Thạnh': { lat: 10.8105, lng: 106.6992 },
      'Tân Bình': { lat: 10.8014, lng: 106.6533 },
      'Thủ Đức': { lat: 10.8494, lng: 106.7537 }
    };

    const foodTemplates = [
      { cat: 'kho', foodName: 'Cơm Tấm', prefix: ['Cơm Tấm Ba Há', 'Cơm Tấm Kiều Giang', 'Cơm Tấm Bụi', 'Cơm Tấm Thu Thảo', 'Cơm Tấm Sài Gòn'] },
      { cat: 'kho', foodName: 'Bánh Mì', prefix: ['Bánh Mì Huỳnh Hoa', 'Bánh Mì Minh Đức', 'Bánh Mì Hà Nội', 'Bánh Mì 362', 'Bánh Mì Hồng Hoa'] },
      { cat: 'nuoc', foodName: 'Phở Bò', prefix: ['Phở Hòa Pasteur', 'Phở Lệ', 'Phở Hùng', 'Phở Thìn', 'Phở Phú Vương'] },
      { cat: 'nuoc', foodName: 'Bún Bò Huế', prefix: ['Bún Bò Út Hưng', 'Bún Bò Xưa', 'Bún Bò Ba Đô', 'Bún Bò Đông Hà', 'Bún Bò O Phượng'] },
      { cat: 'nuoc', foodName: 'Lẩu Bò', prefix: ['Lẩu Bò Hồ Thị Kỷ', 'Lẩu Bò Cô Thảo', 'Lẩu Bò Nhà Gỗ', 'Lẩu Bò Tí Chuột', 'Lẩu Bò Mắm'] },
      { cat: 'tay', foodName: 'Pizza / Đồ Tây', prefix: ['Pizza 4P\'s', 'Pizza Company', 'Domino\'s Pizza', 'Steak House', 'Pasta & Pizza'] },
      { cat: 'trung', foodName: 'Dimsum Trung Hoa', prefix: ['Dimsum Baoz', 'Dimsum Tiệm Bánh Bao', 'Mì Gia Ký', 'Mì Vịt Tiềm Khải Ký', 'Cơm Gà Đông Nguyên'] },
      { cat: 'han', foodName: 'Mì Cay Hàn Quốc', prefix: ['Mì Cay Sasin', 'Mì Cay Naga', 'Kimbap Elegance', 'Tokbokki House', 'Gà Rán Hàn Quốc'] },
      { cat: 'an_vat', foodName: 'Cà Phê / Ăn Vặt', prefix: ['Cà Phê Muối Chú Long', 'Trà Sữa KOI Thé', 'Trà Sữa Phượng Hoàng', 'Ốc Oanh', 'Súp Cua Hạnh'] },
      { cat: 'kho', foodName: 'Bún Đậu Mắm Tôm', prefix: ['Bún Đậu Phố Cổ', 'Bún Đậu Mẹt', 'Bún Đậu Tiến Hải', 'Bún Đậu Làng Mẹt', 'Bún Đậu A Chảnh'] }
    ];

    const imagesList = [
      'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500',
      'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500',
      'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500',
      'https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=500',
      'https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=500',
      'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500',
      'https://images.unsplash.com/photo-1552611052-33e04de081de?w=500',
      'https://images.unsplash.com/photo-1547592180-85f173990554?w=500'
    ];

    // TẠO ĐỦ 500 QUÁN CÓ KÈM TỌA ĐỘ GPS KHÁC NHAU
    const allRestaurants = [];
    let idCounter = 1;

    districts.forEach(dist => {
      const baseCoord = districtCoords[dist];
      for(let i = 1; i <= 50; i++) {
        const tmpl = foodTemplates[i % foodTemplates.length];
        const namePrefix = tmpl.prefix[i % tmpl.prefix.length];
        const rating = (4.0 + (Math.random() * 1.0)).toFixed(1);
        
        // Tạo biến thiên nhẹ tọa độ quanh trung tâm quận
        const lat = baseCoord.lat + (Math.random() - 0.5) * 0.03;
        const lng = baseCoord.lng + (Math.random() - 0.5) * 0.03;

        allRestaurants.push({
          id: idCounter++,
          name: `${namePrefix} (${dist} - Cơ sở ${i})`,
          district: dist,
          cat: tmpl.cat,
          foodName: tmpl.foodName,
          rating: parseFloat(rating),
          address: `Số ${i * 3 + 12} Đường chính, ${dist}`,
          lat: lat,
          lng: lng,
          img: imagesList[i % imagesList.length]
        });
      }
    });

    const masterFoodPool = ['Bánh Mì', 'Phở Bò', 'Cơm Tấm', 'Bún Bò Huế', 'Mì Cay', 'Dimsum', 'Pizza / Đồ Tây', 'Hủ Tiếu', 'Lẩu Bò', 'Cà Phê Muối'];

    let currentPage = 1;
    const itemsPerPage = 10;
    let filteredList = [];
    let currentWheelFoods = [];
    let userLat = null;
    let userLng = null;

    let savedRestaurantIds = JSON.parse(localStorage.getItem('saved_res') || '[]');
    let userLogs = JSON.parse(localStorage.getItem('user_logs') || '[]');

    window.onload = function() {
      searchRestaurants();
      initRandomWheel();
      renderLogs();
      renderSaved();
    };

    // HÀM TÍNH KHOẢNG CÁCH GIỮA 2 ĐIỂM TỌA ĐỘ GPS (ĐƠN VỊ: KM)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Bán kính Trái Đất (km)
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; // Trả về số km
    }

    // HÀM BẬT ĐỊNH VỊ GPS NGUYÊN BẢN TRÊN BÌNH DÂN
    function getUserLocation() {
      const btnStatus = document.getElementById('gps-status');
      if (navigator.geolocation) {
        btnStatus.innerText = 'Đang định vị...';
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLat = position.coords.latitude;
            userLng = position.coords.longitude;
            btnStatus.innerText = 'Đã bật GPS 📍';
            alert('Đã lấy vị trí GPS thành công! Số km tới từng quán sẽ hiển thị ngay bây giờ.');
            searchRestaurants(); // Load lại danh sách có khoảng cách km
          },
          (error) => {
            alert('Không thể truy cập GPS! Hãy cho phép trình duyệt mở quyền vị trí nhé.');
            btnStatus.innerText = 'Thử lại GPS';
          }
        );
      } else {
        alert('Trình duyệt của bạn không hỗ trợ định vị GPS.');
      }
    }

    // HÀM TÌM KIẾM
    function searchRestaurants() {
      const dist = document.getElementById('filter-district').value;
      const cat = document.getElementById('filter-category').value;

      filteredList = allRestaurants.filter(r => {
        const matchDist = r.district === dist;
        const matchCat = cat === 'all' || r.cat === cat;
        return matchDist && matchCat;
      });

      // Nếu có tọa độ GPS người dùng, tính khoảng cách km cho từng quán
      if (userLat && userLng) {
        filteredList.forEach(r => {
          r.distance = calculateDistance(userLat, userLng, r.lat, r.lng);
        });
      }

      // Sắp xếp mặc định theo Rating giảm dần
      filteredList.sort((a, b) => b.rating - a.rating);

      currentPage = 1;
      document.getElementById('count-res').innerText = `${filteredList.length} quán`;
      renderPage();
    }

    // HÀM HIỂN THỊ TRANG TƯƠNG ỨNG
    function renderPage() {
      const container = document.getElementById('food-list');
      if (filteredList.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-slate-400">Không tìm thấy quán phù hợp điều kiện lọc.</div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const pageItems = filteredList.slice(start, end);

      container.innerHTML = pageItems.map(r => {
        const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name + ' ' + r.address)}`;
        
        // Đoạn HTML hiển thị số km nếu có định vị GPS
        const distBadge = r.distance !== undefined 
          ? `<span class="bg-emerald-100 text-emerald-700 font-bold text-[10px] px-2 py-0.5 rounded-full"><i class="fa-solid fa-location-arrow mr-1"></i>${r.distance.toFixed(1)} km</span>`
          : '';

        return `
          <a href="${gmapUrl}" target="_blank" class="bg-white rounded-3xl p-3 shadow-sm border border-purple-50 flex gap-3 items-center active:scale-98 transition block hover:border-purple-300">
            <img src="${r.img}" class="w-20 h-20 rounded-2xl object-cover bg-slate-100">
            <div class="flex-1 space-y-1">
              <div class="flex justify-between items-center">
                <span class="px-2 py-0.5 bg-purple-100 text-purple-700 rounded-full text-[9px] font-bold">${r.district}</span>
                <div class="flex items-center gap-1.5">
                  ${distBadge}
                  <span class="text-xs font-bold text-amber-500">⭐ ${r.rating}</span>
                </div>
              </div>
              <h3 class="font-bold text-xs text-slate-800 line-clamp-1">${r.name}</h3>
              <p class="text-[11px] text-slate-400 line-clamp-1">${r.address}</p>
              <p class="text-[10px] text-purple-600 font-semibold"><i class="fa-solid fa-map-location-dot mr-1"></i> Bấm mở thẳng Google Maps</p>
            </div>
          </a>
        `;
      }).join('');

      renderPaginationControls();
    }

    function renderPaginationControls() {
      const totalPages = Math.ceil(filteredList.length / itemsPerPage);
      const paginationContainer = document.getElementById('pagination');

      if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
      }

      let html = '';
      for (let i = 1; i <= totalPages; i++) {
        const isActive = i === currentPage;
        html += `
          <button onclick="goToPage(${i})" class="w-8 h-8 rounded-xl font-bold text-xs transition ${isActive ? 'bg-purple-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-purple-50'}">
            ${i}
          </button>
        `;
      }
      paginationContainer.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderSaved() {
      const savedList = allRestaurants.filter(r => savedRestaurantIds.includes(r.id));
      const container = document.getElementById('saved-list');
      if(savedList.length === 0) {
        container.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">Chưa có quán nào được lưu.</p>`;
        return;
      }
      container.innerHTML = savedList.map(r => {
        const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name + ' ' + r.address)}`;
        return `
          <a href="${gmapUrl}" target="_blank" class="bg-white rounded-2xl p-3 border flex gap-3 items-center block">
            <img src="${r.img}" class="w-14 h-14 rounded-xl object-cover">
            <div class="flex-1">
              <h4 class="font-bold text-xs">${r.name}</h4>
              <p class="text-[10px] text-slate-400">${r.district} • ⭐ ${r.rating}</p>
            </div>
          </a>
        `;
      }).join('');
    }

    function toggleUploadModal() {
      document.getElementById('upload-modal').classList.toggle('hidden');
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
          callback(compressedBase64);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveLog() {
      const name = document.getElementById('log-name').value;
      const price = document.getElementById('log-price').value;
      const note = document.getElementById('log-note').value;
      const fileInput = document.getElementById('log-file');
      const btn = document.getElementById('btn-submit-log');

      if(!name) { alert('Vui lòng nhập tên quán!'); return; }

      btn.innerText = 'Đang lưu...';
      btn.disabled = true;

      const executeSave = (imgData) => {
        const newLog = {
          id: Date.now(),
          name, price, note,
          date: new Date().toLocaleDateString('vi-VN'),
          img: imgData || 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=500'
        };
        userLogs.unshift(newLog);
        try {
          localStorage.setItem('user_logs', JSON.stringify(userLogs));
        } catch (e) {
          alert('Bộ nhớ đầy, hãy thử dùng ảnh nhẹ hơn nhé!');
        }
        
        document.getElementById('log-name').value = '';
        document.getElementById('log-price').value = '';
        document.getElementById('log-note').value = '';
        fileInput.value = '';
        btn.innerText = 'Lưu Nhật Ký';
        btn.disabled = false;

        renderLogs();
        toggleUploadModal();
      };

      if(fileInput.files && fileInput.files[0]) {
        compressImage(fileInput.files[0], (compressedData) => {
          executeSave(compressedData);
        });
      } else {
        executeSave(null);
      }
    }

    function deleteLog(id) {
      if(confirm('Bạn có muốn xóa nhật ký này không?')) {
        userLogs = userLogs.filter(l => l.id !== id);
        localStorage.setItem('user_logs', JSON.stringify(userLogs));
        renderLogs();
      }
    }

    function renderLogs() {
      const container = document.getElementById('user-logs-list');
      if(userLogs.length === 0) {
        container.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">Bạn chưa lưu nhật ký ăn uống nào.</p>`;
        return;
      }
      container.innerHTML = userLogs.map(l => `
        <div class="bg-white rounded-3xl p-4 border space-y-2 shadow-sm relative">
          <button onclick="deleteLog(${l.id})" class="absolute top-3 right-3 text-slate-300 hover:text-red-500 text-sm">
            <i class="fa-solid fa-trash"></i>
          </button>
          <div class="flex justify-between items-center pr-6">
            <h4 class="font-bold text-xs text-slate-800">${l.name}</h4>
            <span class="text-[10px] text-slate-400">${l.date}</span>
          </div>
          <p class="text-[11px] text-purple-600 font-bold">💰 Tầm giá: ${l.price || 'Chưa nhập'}</p>
          <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-xl">${l.note || 'Không có ghi chú'}</p>
          <img src="${l.img}" class="w-full h-40 object-cover rounded-2xl bg-slate-100">
        </div>
      `).join('');
    }

    function switchHistorySubTab(sub) {
      document.getElementById('subtab-logs').classList.toggle('hidden', sub !== 'logs');
      document.getElementById('subtab-saved').classList.toggle('hidden', sub !== 'saved');
      document.getElementById('subnav-logs').className = sub === 'logs' ? 'flex-1 py-2 rounded-xl bg-white text-purple-600 shadow-sm transition' : 'flex-1 py-2 rounded-xl text-slate-500 transition';
      document.getElementById('subnav-saved').className = sub === 'saved' ? 'flex-1 py-2 rounded-xl bg-white text-purple-600 shadow-sm transition' : 'flex-1 py-2 rounded-xl text-slate-500 transition';
    }

    function switchTab(tab) {
      document.getElementById('tab-home').classList.toggle('hidden', tab !== 'home');
      document.getElementById('tab-history').classList.toggle('hidden', tab !== 'history');
      document.getElementById('tab-wheel').classList.toggle('hidden', tab !== 'wheel');

      document.getElementById('nav-home').className = tab === 'home' ? 'flex flex-col items-center text-purple-600' : 'flex flex-col items-center text-slate-400';
      document.getElementById('nav-history').className = tab === 'history' ? 'flex flex-col items-center text-purple-600' : 'flex flex-col items-center text-slate-400';
      document.getElementById('nav-wheel').className = tab === 'wheel' ? 'flex flex-col items-center text-purple-600' : 'flex flex-col items-center text-slate-400';

      if(tab === 'wheel') drawWheel();
    }

    function initRandomWheel() {
      currentWheelFoods = [...masterFoodPool];
    }

    function drawWheel() {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const colors = ['#8b5cf6', '#a78bfa', '#c084fc', '#e879f9', '#f472b6', '#fb7185', '#38bdf8', '#818cf8', '#a855f7', '#d946ef'];
      const slice = (2 * Math.PI) / currentWheelFoods.length;

      ctx.clearRect(0, 0, 280, 280);
      currentWheelFoods.forEach((food, i) => {
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(140, 140);
        ctx.arc(140, 140, 140, i * slice, (i + 1) * slice);
        ctx.fill();

        ctx.save();
        ctx.translate(140, 140);
        ctx.rotate(i * slice + slice / 2);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px sans-serif";
        ctx.fillText(food.substring(0, 12), 45, 4);
        ctx.restore();
      });
    }

    let currentRotation = 0;
    function spinWheel() {
      const wheel = document.getElementById('wheel');
      const extraDegree = Math.floor(Math.random() * 360);
      const totalSpin = 1800 + extraDegree;
      currentRotation += totalSpin;
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      document.getElementById('wheel-result-box').classList.add('hidden');

      setTimeout(() => {
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        
        const sliceAngle = 360 / currentWheelFoods.length;
        const netRotation = (currentRotation % 360);
        let pointerAngle = (270 - netRotation) % 360;
        if (pointerAngle < 0) pointerAngle += 360;

        const selectedIndex = Math.floor(pointerAngle / sliceAngle);
        const selectedFood = currentWheelFoods[selectedIndex];

        document.getElementById('wheel-result-title').innerText = selectedFood;

        const matches = allRestaurants
          .filter(r => r.foodName.toLowerCase().includes(selectedFood.toLowerCase()) || selectedFood.toLowerCase().includes(r.foodName.toLowerCase()))
          .sort((a,b) => b.rating - a.rating);
        
        const recContainer = document.getElementById('wheel-recommend-list');
        if(matches.length > 0) {
          recContainer.innerHTML = matches.slice(0, 3).map(r => `
            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name + ' ' + r.address)}" target="_blank" class="p-2.5 bg-slate-50 rounded-2xl flex justify-between items-center text-xs border hover:bg-purple-50 transition cursor-pointer block">
              <div>
                <p class="font-bold text-slate-800">${r.name}</p>
                <p class="text-[10px] text-slate-400">${r.district} • ${r.address}</p>
              </div>
              <span class="text-amber-500 font-bold">⭐ ${r.rating}</span>
            </a>
          `).join('');
        } else {
          recContainer.innerHTML = `
            <div class="p-3 bg-slate-50 rounded-2xl text-xs text-slate-500 space-y-1">
              <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedFood)}" target="_blank" class="text-purple-600 font-bold underline inline-block">
                🔍 Tìm quán ${selectedFood} gần bạn trên Google Maps
              </a>
            </div>
          `;
        }

        document.getElementById('wheel-result-box').classList.remove('hidden');
      }, 3600);
    }
  </script>
